name: WildWorkMobile

options:
  bundleIdPrefix: com.wildwork
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  WildWorkMobile:
    type: application
    platform: iOS
    sources:
      - path: WildWorkMobile
        excludes:
          - "www/**"
      # 共享 UI：构建前由 CI 复制到 WildWorkMobile/www，作为目录资源整体打包
      - path: WildWorkMobile/www
        type: folder
        buildPhase: resources
    info:
      path: WildWorkMobile/Info.plist
      properties:
        CFBundleDisplayName: WildWork
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        # 面板通常跑在局域网 HTTP 上；ATS 默认会拦明文请求
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # iOS 14+ 访问局域网设备需要用途说明，否则被静默拒绝
        NSLocalNetworkUsageDescription: 需要访问局域网内的 wild-work 服务器来读取账号与积分数据。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildwork.mobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
