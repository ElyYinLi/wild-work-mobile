name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 版本号与上游最新 tag 对齐，便于识别构建时对应的上游版本。
        run: python3 scripts/resolve_upstream_version.py --github-env

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync shared UI into APK assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r mobile-ui/. android/app/src/main/assets/www/
          ls -la android/app/src/main/assets/www/

      - name: Build release APK
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace \
            -PupstreamVersion="${{ env.WW_VERSION }}" \
            -PversionCode="${{ env.WW_VERSION_CODE }}"

      - name: Collect artifact
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "found: $APK"
          cp "$APK" dist/WildWorkMobile.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildWorkMobile-apk
          path: dist/WildWorkMobile.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android 最新构建
          body: |
            对应上游版本：`${{ env.WW_VERSION }}`

            由 GitHub Actions 自动构建（commit `${{ github.sha }}`）。

            安装：下载 `WildWorkMobile.apk` 直接安装（debug 签名，需允许「未知来源」）。
          files: dist/WildWorkMobile.apk
          make_latest: true
